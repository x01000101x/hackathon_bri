        <template class="raw-markdown"># Code Quality, Structural, and Code-Smell Audit (v1.0.1)

This document provides a comprehensive code quality, structural, and security audit of the changes introduced in version \`v1.0.1\`. 

---

## 1. Summary of Code Modifications

The changes introduce an automated, AI-driven technical documentation and code review agent. The codebase is split into three primary areas:
*   **Documentation Agent (\`agent/\` package)**: 
    *   \`agent.go\`: Orchestrates the execution flow. It detects the git base branch, extracts Go and SQL diffs, resolves the documentation version, calls the Gemini API, and triggers HTML report generation.
    *   \`html.go\` & \`html_test.go\`: Handles version resolution (parsing and auto-incrementing patch versions from HTML comments) and generates/updates responsive, glassmorphism-styled HTML reports.
    *   \`llm.go\`: Integrates with the Google Generative AI SDK (\`gemini-1.5-flash\` by default) to generate markdown-formatted code and database schema reviews.
*   **CLI Entrypoint (\`main.go\`)**: Implements a CLI interface supporting a \`generate\` subcommand with an optional \`-version\` flag override.
*   **Database Models (\`models/\` package)**:
    *   \`user.go\`: Defines a GORM \`User\` model, a \`BeforeCreate\` hook for validation, and a query helper \`FindActiveUsers\`.

---

## 2. Structural Adjustments & Architecture

### Single Responsibility Principle (SRP) Violations
The \`agent\` package is highly coupled and handles too many distinct responsibilities:
1.  **CLI/OS Interaction**: Reading environment variables and executing shell commands (\`git\`).
2.  **LLM Client Management**: Initializing, configuring, and calling the Gemini API.
3.  **HTML Rendering**: Storing a massive (~400 lines) HTML/CSS/JS template as a hardcoded Go string and performing regex-based string manipulation on it.

### Tight Coupling & Lack of Dependency Injection
The functions in \`llm.go\` (\`GenerateCodeReview\` and \`GenerateQueryReview\`) are package-level functions that initialize a new Gemini client on *every single invocation*. This prevents mocking the LLM client during unit testing and leads to unnecessary resource allocation.

### Hardcoded Presentation Layer
Embedding raw HTML, CSS, and JavaScript inside \`html.go\` makes the code difficult to maintain, read, and format. It also prevents front-end assets from being linted or minified.

---

## 3. Go Quality, Idiomatic Style & Error Handling

### Missing Context Propagation
Go idiomatic style dictates that network operations (such as calling the Gemini API) must accept a \`context.Context\` parameter. Currently, \`GenerateCodeReview\`, \`GenerateQueryReview\`, and \`callGeminiAPI\` hardcode \`context.Background()\`. This prevents callers from setting timeouts, handling cancellations, or propagating trace IDs.

### Silent Failures & Ignored Errors
In \`html.go\` (\`resolveVersion\` function), errors from \`strconv.Atoi\` are silently ignored using the blank identifier:
\`\`\`go
major, _ := strconv.Atoi(parts[0])
minor, _ := strconv.Atoi(parts[1])
patch, _ := strconv.Atoi(parts[2])
\`\`\`
If the HTML file contains a malformed version comment (e.g., \`<!-- AGENT_VERSION: v1.b.3 -->\`), these variables will silently default to \`0\` without returning an error, leading to unexpected version jumps.

### Non-Idiomatic GORM Error Usage
In \`models/user.go\`, the \`BeforeCreate\` hook returns \`gorm.ErrRecordNotFound\` when validation fails:
\`\`\`go
if u.Email == "" {
    return gorm.ErrRecordNotFound // Dummy error for validation
}
\`\`\`
\`gorm.ErrRecordNotFound\` is explicitly reserved for query failures (i.e., when a requested row does not exist). Returning it for a validation failure is highly misleading and will break standard error-handling patterns downstream.

### Package-Level Side Effects (Logging)
\`agent.go\` uses \`fmt.Println\` and \`fmt.Printf\` directly. Library packages should either accept an \`io.Writer\` for output, use a structured logger (like \`log/slog\`), or return data to the caller to print, making the package testable and reusable.

---

## 4. Code Smells & Security Flaws

### ⚠️ High Risk: Cross-Site Scripting (XSS) in HTML Reports
In \`html.go\`, the markdown review generated by the LLM is injected directly into a \`<template>\` tag inside the HTML report:
\`\`\`go
return fmt.Sprintf(\`... <template class="raw-markdown">%s</template> ...\`, escapedMarkdown)
\`\`\`
In the browser, \`marked.parse()\` is called on this raw content. Although backticks and dollar signs are escaped, **arbitrary HTML tags are not sanitized**. If an attacker crafts a malicious git commit containing a payload designed to exploit prompt injection, they could force the LLM to output malicious \`<script>\` tags. When another developer opens the generated \`code_review.html\`, this script will execute in their browser (Stored XSS).

### ⚠️ Medium Risk: Missing Subresource Integrity (SRI) on CDNs
The HTML template imports external libraries (\`marked.min.js\`, \`prism-core.min.js\`, \`prism-autoloader.min.js\`) from unpinned, public CDNs without Subresource Integrity (SRI) hashes:
\`\`\`html
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
\`\`\`
If the CDN is compromised or the DNS is poisoned, malicious code could be injected into the developer's local documentation reports.

### Resource Leak: Ephemeral LLM Clients
In \`llm.go\`, \`callGeminiAPI\` instantiates a new client and defers its closure on every call:
\`\`\`go
client, err := genai.NewClient(ctx, option.WithAPIKey(apiKey))
...
defer client.Close()
\`\`\`
If \`RunGenerate\` is executed in a loop or a CI/CD pipeline with many files, this creates excessive TCP connections and API handshakes, leading to socket exhaustion and high latency.

### Performance: Unindexed Database Query
In \`models/user.go\`, \`FindActiveUsers\` queries the database using \`is_active\`:
\`\`\`go
err := db.Where("is_active = ?", true).Order("created_at DESC").Find(&users).Error
\`\`\`
The \`User\` struct defines \`IsActive\` as:
\`\`\`go
IsActive  bool           \`gorm:"default:true" json:"is_active"\`
\`\`\`
There is no index on \`is_active\` or \`created_at\`. As the \`users\` table grows, this query will trigger a full table scan and a filesort operation, severely degrading database performance.

### Concurrency: File Write Race Condition
\`UpdateHTMLReport\` reads the existing HTML file, modifies it in memory, and writes it back. If two instances of the agent run concurrently (e.g., in parallel CI pipelines), they will overwrite each other's changes, leading to corrupted HTML reports.

---

## 5. Actionable Recommendations

### Recommendation 1: Extract HTML Template using \`go:embed\`
Move the massive HTML template out of \`html.go\` into a dedicated file (\`agent/templates/report.html\`) and use Go's native \`embed\` package.

**\`agent/templates/report.html\`** (Truncated for brevity):
\`\`\`html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{.Title}} | AI Technical Documentation Agent</title>
  ...
</head>
<body>
  <!-- AGENT_VERSION: {{.Version}} -->
  ...
</body>
</html>
\`\`\`

**\`agent/html.go\`**:
\`\`\`go
package agent

import (
	_ "embed"
	"html/template"
	"io"
)

//go:embed templates/report.html
var reportTemplateHTML string

var reportTemplate = template.Must(template.New("report").Parse(reportTemplateHTML))

type ReportData struct {
	Title           string
	Version         string
	DateStr         string
	InitialCardHTML template.HTML
}

func renderTemplate(w io.Writer, data ReportData) error {
	return reportTemplate.Execute(w, data)
}
\`\`\`

### Recommendation 2: Refactor LLM Client into a Reusable Struct with Context
Introduce an \`Agent\` struct that holds a reusable \`genai.Client\` and accepts a \`context.Context\` with a timeout.

**\`agent/llm.go\`**:
\`\`\`go
package agent

import (
	"context"
	"errors"
	"fmt"
	"os"

	"github.com/google/generative-ai-go/genai"
	"google.golang.org/api/option"
)

type Reviewer struct {
	client *genai.Client
	model  string
}

func NewReviewer(ctx context.Context) (*Reviewer, error) {
	apiKey := os.Getenv("GEMINI_API_KEY")
	if apiKey == "" {
		return nil, errors.New("GEMINI_API_KEY environment variable is not set")
	}

	client, err := genai.NewClient(ctx, option.WithAPIKey(apiKey))
	if err != nil {
		return nil, fmt.Errorf("failed to create Gemini client: %w", err)
	}

	modelName := "gemini-1.5-flash"
	if customModel := os.Getenv("GEMINI_MODEL"); customModel != "" {
		modelName = customModel
	}

	return &Reviewer{
		client: client,
		model:  modelName,
	}, nil
}

func (r *Reviewer) Close() error {
	return r.client.Close()
}

func (r *Reviewer) GenerateCodeReview(ctx context.Context, goDiff, version string) (string, error) {
	prompt := fmt.Sprintf("...", version, goDiff) // Prompt construction
	return r.callGeminiAPI(ctx, prompt)
}

func (r *Reviewer) callGeminiAPI(ctx context.Context, prompt string) (string, error) {
	model := r.client.GenerativeModel(r.model)
	temp := float32(0.2)
	model.Temperature = &temp

	resp, err := model.GenerateContent(ctx, genai.Text(prompt))
	if err != nil {
		return "", fmt.Errorf("Gemini API execution error: %w", err)
	}
    // ... rest of response parsing logic
    return fmt.Sprint(resp.Candidates[0].Content.Parts[0]), nil
}
\`\`\`

### Recommendation 3: Fix GORM Validation and Add Database Indexes
Replace the incorrect \`gorm.ErrRecordNotFound\` with a custom validation error, and add a composite index on \`(is_active, created_at DESC)\` to optimize the query.

**\`models/user.go\`**:
\`\`\`go
package models

import (
	"errors"
	"time"

	"gorm.io/gorm"
)

var ErrInvalidEmail = errors.New("validation failed: email address cannot be empty")

type User struct {
	ID        uint           \`gorm:"primaryKey" json:"id"\`
	// Added composite index for active users sorted by creation date
	Email     string         \`gorm:"uniqueIndex;type:varchar(255);not null" json:"email"\`
	Password  string         \`gorm:"type:varchar(255);not null" json:"-"\`
	Name      string         \`gorm:"type:varchar(100)" json:"name"\`
	IsActive  bool           \`gorm:"default:true;index:idx_active_created,priority:1" json:"is_active"\`
	CreatedAt time.Time      \`gorm:"index:idx_active_created,priority:2" json:"created_at"\`
	UpdatedAt time.Time      \`json:"updated_at"\`
	DeletedAt gorm.DeletedAt \`gorm:"index" json:"-"\`
}

func (u *User) BeforeCreate(tx *gorm.DB) (err error) {
	if u.Email == "" {
		return ErrInvalidEmail
	}
	return nil
}
\`\`\`

        <template class="raw-markdown"># Code Quality, Structural, and Code-Smell Audit (v1.0.1)

This audit provides a comprehensive review of the changes introduced in version \`v1.0.1\`. The codebase introduces an automated, AI-driven documentation agent that analyzes Git diffs, queries the Gemini LLM, and generates/updates HTML reports. It also introduces a basic GORM-based \`User\` model.

---

## 1. Summary of Code Modifications

The changes introduce a command-line utility and supporting packages to automate code and database schema reviews:
*   **\`main.go\`**: Entry point implementing a CLI interface with a \`generate\` subcommand.
*   **\`agent/agent.go\`**: Orchestrates the workflow: detects the base Git branch, extracts Go and SQL diffs, resolves the documentation version, calls the Gemini API, and writes HTML reports.
*   **\`agent/html.go\` & \`agent/html_test.go\`**: Handles HTML report generation, version auto-incrementing via regex parsing of existing reports, and unit tests for version resolution.
*   **\`agent/llm.go\`**: Integrates with the Google Generative AI Go SDK (\`genai\`) to send prompts and retrieve markdown reviews.
*   **\`models/user.go\`**: Defines a GORM \`User\` model, a \`BeforeCreate\` hook, and a query function (\`FindActiveUsers\`).

---

## 2. Structural Adjustments & Architecture

### Package Layout and Coupling
*   **High Coupling in \`agent\`**: The \`agent\` package is overloaded with responsibilities. It handles OS-level execution (\`git\`), external API communication (\`Gemini\`), HTML rendering, and file I/O. 
*   **Lack of Interfaces**: There are no interfaces defining the LLM client or the VCS (Git) operations. This makes unit testing difficult without making actual API calls or relying on the local Git environment.
*   **Hardcoded Dependencies**: The Gemini client initialization is hardcoded inside \`callGeminiAPI\`. It directly accesses environment variables (\`GEMINI_API_KEY\`, \`GEMINI_MODEL\`) rather than accepting configuration parameters.

### Dependency Flow
\`\`\`
main.go ──> agent (agent.go, html.go, llm.go) ──> Third-party SDKs (Gemini, GORM)
\`\`\`
The flow is linear, but the lack of Dependency Injection (DI) prevents mocking the LLM or Git wrapper during testing.

---

## 3. Go Quality, Idiomatic Style & Error Handling

### Context Propagation
*   **Anti-Pattern**: \`context.Background()\` is instantiated directly inside \`callGeminiAPI\` (in \`llm.go\`). 
*   **Best Practice**: In Go, \`context.Context\` should be passed as the first parameter of functions performing I/O. This allows callers to manage timeouts, propagation, and cancellations (e.g., if the CLI user hits \`Ctrl+C\`).

### Silent/Ignored Errors
In \`agent/html.go\` (\`resolveVersion\`):
\`\`\`go
major, _ := strconv.Atoi(parts[0])
minor, _ := strconv.Atoi(parts[1])
patch, _ := strconv.Atoi(parts[2])
\`\`\`
Ignoring these errors means that if the HTML file contains a malformed version string (e.g., \`<!-- AGENT_VERSION: v1.b.3 -->\`), the parser will silently default the failed parts to \`0\` without notifying the user.

### Misleading GORM Error Usage
In \`models/user.go\` (\`BeforeCreate\`):
\`\`\`go
if u.Email == "" {
    return gorm.ErrRecordNotFound // Dummy error for validation
}
\`\`\`
*   **Issue**: Returning \`gorm.ErrRecordNotFound\` for a validation failure is highly misleading. \`ErrRecordNotFound\` indicates a query returned no rows. Returning it here will confuse callers handling database transactions.

---

## 4. Code Smells & Security Flaws

### 1. Cross-Site Scripting (XSS) / HTML Injection (Critical)
In \`agent/html.go\`, the LLM-generated markdown is injected directly into the HTML template inside a \`<template>\` tag:
\`\`\`go
return fmt.Sprintf(\`...
      <div class="card-content active" id="content-%s">
        <div class="markdown-rendered"></div>
        <template class="raw-markdown">%s</template>
      </div>
...\`, ..., escapedMarkdown)
\`\`\`
*   **Vulnerability**: If the LLM output contains malicious payloads (e.g., \`</template><script>alert(1)</script>\`)—either due to prompt injection via the git diff or an untrusted LLM response—it will break out of the \`<template>\` tag and execute arbitrary JavaScript when a developer opens the HTML report in a browser.

### 2. Command Injection Risk & Missing Timeouts (Medium)
In \`agent/agent.go\` (\`getGitDiff\` and \`runGitVerify\`):
*   **No Timeout**: \`exec.Command\` is used without a context. If \`git\` hangs (e.g., waiting for authentication, lock files, or GPG signing prompts), the entire Go application will hang indefinitely.
*   **Sanitization**: Although \`baseBranch\` is resolved internally, passing raw strings directly to shell commands is risky if the branch name contains malicious characters (e.g., from a remote branch named \`origin/; rm -rf /;\`).

### 3. Non-Atomic File Writes (Low-Medium)
In \`agent/html.go\` (\`UpdateHTMLReport\`):
\`\`\`go
return os.WriteFile(filePath, []byte(finalHTML), 0644)
\`\`\`
*   **Issue**: If the write operation fails midway (e.g., disk full, process interrupted), the existing \`code_review.html\` or \`query_review.html\` file will be left corrupted or empty.

### 4. Missing Database Indexing
In \`models/user.go\` (\`FindActiveUsers\`):
\`\`\`go
err := db.Where("is_active = ?", true).Order("created_at DESC").Find(&users).Error
\`\`\`
*   **Issue**: If the \`users\` table grows large, filtering by \`is_active\` and ordering by \`created_at DESC\` will trigger a full-table scan and an expensive filesort. A composite index on \`(is_active, created_at DESC)\` is missing.

---

### Recommendation 1: Secure HTML Generation & Prevent XSS
Replace raw string formatting with Go's standard \`html/template\` package, which automatically applies context-aware escaping.

func generateAuditCardHTML(version, dateStr, markdownReview string) (string, error) {
	tmpl, err := template.New("card").Parse(cardTemplate)
	if err != nil {
		return "", err

	var buf bytes.Buffer
	err = tmpl.Execute(&buf, map[string]string{
		"Version":  version,
		"CardID":   "audit-" + strings.ReplaceAll(version, ".", "-"),
		"DateStr":  dateStr,
		"Markdown": markdownReview, // html/template safely escapes this

### Recommendation 2: Propagate Context and Enforce Timeouts
Modify the signature of \`RunGenerate\` and downstream functions to accept a \`context.Context\` with a timeout.

\`\`\`go
// agent/agent.go
import "context"

func RunGenerate(ctx context.Context, customVersion string) error {
    // ...
    goDiff, err := getGitDiff(ctx, baseBranch, "*.go")
    // ...
}

func getGitDiff(ctx context.Context, baseBranch, filePattern string) (string, error) {
    // Enforce a 10-second timeout for Git operations
    execCtx, cancel := context.WithTimeout(ctx, 10*time.Second)
    defer cancel()

    cmd := exec.CommandContext(execCtx, "git", "diff", baseBranch+"...HEAD", "--", filePattern)
    out, err := cmd.Output()
    if err != nil {
        cmd = exec.CommandContext(execCtx, "git", "diff", baseBranch, "--", filePattern)
        out, err = cmd.Output()
        if err != nil {
            return "", err
        }
    }
    return string(out), nil
}

### Recommendation 4: Implement Atomic File Writes
Write to a temporary file first, then atomically rename it to prevent file corruption.

\`\`\`go
// agent/html.go
import "io/ioutil"

func safelyWriteFile(filePath string, data []byte) error {
	dir := filepath.Dir(filePath)
	tmpFile, err := os.CreateTemp(dir, "report-*.tmp")
	if err != nil {
		return err
	}
	tmpName := tmpFile.Name()
	defer func() {
		tmpFile.Close()
		os.Remove(tmpName) // Clean up if rename fails
	}()

	if _, err := tmpFile.Write(data); err != nil {
		return err
	}
	if err := tmpFile.Close(); err != nil {
		return err
	}

	// Atomic rename
	return os.Rename(tmpName, filePath)
}

## 1. Summary of Code Modifications

The introduced changes establish a new command-line tool and automation agent designed to analyze Git diffs (both Go source code and SQL migration files) and leverage the Google Gemini LLM to generate automated code quality and database schema reviews. 

### Affected Packages & Files:
*   **\`main.go\`**: Entry point of the application. Implements a basic CLI interface supporting a \`generate\` subcommand with flag parsing.
*   **\`agent/\`**: The core engine package.
    *   \`agent.go\`: Orchestrates the workflow (checking environment variables, executing Git commands to extract diffs, invoking the LLM, and triggering report updates).
    *   \`html.go\`: Manages HTML report generation, version auto-incrementing via regex parsing, and contains a large embedded HTML/CSS/JS template.
    *   \`html_test.go\`: Unit tests verifying the version resolution and auto-increment logic.
    *   \`llm.go\`: Integrates with the official Google Generative AI Go SDK to dispatch prompts and retrieve markdown reviews.
*   **\`models/\`**: Contains database models.
    *   \`user.go\`: Defines a GORM \`User\` struct, a GORM creation hook, and a query function to fetch active users.

---

## 2. Structural Adjustments & Architecture

### Package Design & Single Responsibility Principle (SRP)
The \`agent\` package is overloaded. It handles CLI orchestration, OS-level process execution (Git), HTML template rendering, file I/O, and external API communication. 
*   **Tight Coupling**: The LLM client and Git execution are tightly coupled to the package functions. This prevents mocking and makes unit testing the orchestration logic (\`RunGenerate\`) virtually impossible without setting up a live Git repository and valid Gemini API keys.
*   **Lack of Interfaces**: There are no defined interfaces for the LLM client or the Git VCS provider.

### Template Management
*   **Hardcoded HTML**: \`agent/html.go\` contains a massive, hardcoded HTML string (\`getHTMLTemplate\`). This is unidiomatic, difficult to maintain, and forces the developer to escape percent signs (\`%%\`) to prevent \`fmt.Sprintf\` parsing errors. 

---

## 3. Go Quality, Idiomatic Style & Error Handling

### Context Propagation
*   **Missing Contexts**: The \`agent\` package completely ignores Go's \`context\` paradigm. \`callGeminiAPI\` instantiates its own \`context.Background()\`. Contexts should be passed from \`main.go\` down to the API calls and command executions to allow for graceful cancellation, timeouts, and distributed tracing.

### Error Handling & Silent Failures
*   **Ignored Errors**: In \`agent/html.go\` (\`resolveVersion\`), string-to-integer conversions ignore errors:
    \`\`\`go
    major, _ := strconv.Atoi(parts[0])
    minor, _ := strconv.Atoi(parts[1])
    patch, _ := strconv.Atoi(parts[2])
    \`\`\`
    If the HTML comment contains non-numeric characters that bypassed the regex, these variables silently default to \`0\`, leading to incorrect version increments.
*   **Misleading GORM Errors**: In \`models/user.go\`, the \`BeforeCreate\` hook returns \`gorm.ErrRecordNotFound\` when validation fails (i.e., when the email is empty). This is highly misleading; a validation failure should return a specific validation error (e.g., \`errors.New("validation failed: email cannot be empty")\`).

### Resource Management
*   **Command Execution**: \`exec.Command\` is used without timeouts. If a Git command hangs (e.g., waiting for credentials or lock files), the entire application will block indefinitely.

---

## 4. Code Smells & Security Flaws

### Cross-Site Scripting (XSS) Vulnerability
*   **Unsanitized Markdown Rendering**: The application writes the raw markdown returned by the Gemini API directly into a \`<template>\` tag inside the HTML report. On page load, the client-side library \`marked.js\` parses this raw markdown and injects it into the DOM via \`innerHTML\`.
*   **Attack Vector**: If an attacker submits a pull request containing malicious JavaScript inside a Go comment or SQL file, the Gemini API might echo this code in its review. When a developer opens the generated \`code_review.html\`, the script will execute in their browser context.

### Resource Leaks & Inefficiencies
*   **Redundant Client Initialization**: \`callGeminiAPI\` initializes a new GenAI client and closes it *on every single call*:
    \`\`\`go
    client, err := genai.NewClient(ctx, option.WithAPIKey(apiKey))
    // ...
    defer client.Close()
    \`\`\`
    Since \`RunGenerate\` calls both \`GenerateCodeReview\` and \`GenerateQueryReview\`, it establishes and tears down TCP/TLS connections to Google's servers twice. The client should be initialized once and reused.

### Database Performance (Missing Indexes)
*   **Inefficient Querying**: In \`models/user.go\`, \`FindActiveUsers\` executes:
    \`\`\`go
    db.Where("is_active = ?", true).Order("created_at DESC").Find(&users)
    \`\`\`
    The \`User\` struct defines an index on \`DeletedAt\` and a unique index on \`Email\`, but **no index** on \`is_active\` or \`created_at\`. As the database grows, this query will trigger a full table scan and an expensive filesort operation.

---

## 5. Actionable Recommendations

### Recommendation A: Decouple LLM Client & Reuse Connections
Refactor the LLM interaction into a reusable struct that accepts a context and maintains a single client instance.

\`\`\`go
// agent/llm.go
package agent

import (
	"context"
	"fmt"
	"github.com/google/generative-ai-go/genai"
	"google.golang.org/api/option"
)

type GeminiClient struct {
	client    *genai.Client
	modelName string
}

func NewGeminiClient(ctx context.Context, apiKey, modelName string) (*GeminiClient, error) {
	client, err := genai.NewClient(ctx, option.WithAPIKey(apiKey))
	if err != nil {
		return nil, fmt.Errorf("failed to create Gemini client: %w", err)
	}
	if modelName == "" {
		modelName = "gemini-1.5-flash"
	}
	return &GeminiClient{
		client:    client,
		modelName: modelName,
	}, nil
}

func (g *GeminiClient) Close() error {
	return g.client.Close()
}

func (g *GeminiClient) GenerateReview(ctx context.Context, prompt string) (string, error) {
	model := g.client.GenerativeModel(g.modelName)
	temp := float32(0.2)
	model.Temperature = &temp

	resp, err := model.GenerateContent(ctx, genai.Text(prompt))
	if err != nil {
		return "", fmt.Errorf("Gemini API execution error: %w", err)
	}
	if len(resp.Candidates) == 0 || resp.Candidates[0].Content == nil {
		return "", fmt.Errorf("Gemini returned an empty response")
	}

	return fmt.Sprint(resp.Candidates[0].Content.Parts[0]), nil
}

### Recommendation C: Secure Command Executions with Context Timeouts
Ensure external Git commands cannot hang indefinitely by wrapping them in a context with a strict timeout.

\`\`\`go
// agent/agent.go
import "context"

func getGitDiff(ctx context.Context, baseBranch, filePattern string) (string, error) {
	ctx, cancel := context.WithTimeout(ctx, 5*time.Second)
	defer cancel()

	cmd := exec.CommandContext(ctx, "git", "diff", baseBranch+"...HEAD", "--", filePattern)
	out, err := cmd.Output()
	if err != nil {
		// Fallback
		cmd = exec.CommandContext(ctx, "git", "diff", baseBranch, "--", filePattern)
		out, err = cmd.Output()
		if err != nil {
			return "", fmt.Errorf("git diff failed: %w", err)
		}
	}
	return string(out), nil
}
